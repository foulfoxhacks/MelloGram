[package]
name = "mellogram"
description = "MelloGram — a customisable Telegram desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mellogram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mellogram"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mellogram-core.workspace = true
mellogram-e2e.workspace = true
mellogram-plugins.workspace = true
mellogram-telegram.workspace = true
melloid-core.workspace = true
mellorpc-core.workspace = true
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio.workspace = true
ureq = "2"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
ametherian-truee2e = { path = "../../crates/ametherian-truee2e" }
zeroize = "1"
flate2 = "1"
chrono.workspace = true
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
