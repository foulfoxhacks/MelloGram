name: Cloudflare deploy (web client and MelloID)

# Deploys services/web-client and services/melloid-public to Cloudflare Workers:
#   https://id.mellogram.foulfoxhacks.dev      (MelloID public profiles, D1)
#   https://wc.mellogram.foulfoxhacks.dev      (shell)
#   https://wc-api.mellogram.foulfoxhacks.dev  (API)
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit and
# Workers Routes / custom domains on the foulfoxhacks.dev zone) and
# CLOUDFLARE_ACCOUNT_ID. Without them the job tests and reports, then stops
# without failing, so forks and branches stay green.

on:
  push:
    branches: [main]
    paths: ["services/web-client/**", "services/melloid-public/**", ".github/workflows/web-client.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-client-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: services/web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test routing, headers, CORS and HTTPS handling
        run: npm test
      - name: Check deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."
          fi
      - name: Deploy the Worker (both hostnames)
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      # A brand-new custom domain can take a while to get its certificate. TLS
      # handshake failures (curl exit 35/60) are reported as warnings, not
      # failures; a reachable endpoint answering with an error still fails.
      - name: Smoke-test the live endpoints over HTTPS
        if: steps.creds.outputs.ready == 'true'
        id: smoke
        run: |
          tls_pending=0
          for url in https://wc.mellogram.foulfoxhacks.dev/api/health https://wc-api.mellogram.foulfoxhacks.dev/api/status; do
            ok=0
            for i in 1 2 3 4 5 6; do
              code=0; curl -fsS --proto '=https' --tlsv1.2 -o /dev/null "$url" || code=$?
              if [ "$code" = 0 ]; then ok=1; echo "answers: $url"; break; fi
              if [ "$code" != 35 ] && [ "$code" != 60 ] && [ "$code" != 6 ] && [ "$code" != 7 ]; then echo "::error::$url failed (curl $code)"; exit 1; fi
              sleep 20
            done
            if [ "$ok" = 0 ]; then tls_pending=1; echo "::warning::$url has no certificate or DNS yet; Cloudflare is still issuing it"; fi
          done
          echo "tls_pending=$tls_pending" >> "$GITHUB_OUTPUT"
      - name: Check HSTS and CORS on the live API
        if: steps.creds.outputs.ready == 'true' && steps.smoke.outputs.tls_pending == '0'
        run: |
          curl -fsSI https://wc.mellogram.foulfoxhacks.dev/ | grep -i '^strict-transport-security'
          curl -fsS -D - -o /dev/null -H 'Origin: https://wc.mellogram.foulfoxhacks.dev' https://wc-api.mellogram.foulfoxhacks.dev/api/status \
            | grep -i '^access-control-allow-origin: https://wc.mellogram.foulfoxhacks.dev'

  melloid:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: services/melloid-public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Test profile validation, projection and HTTPS handling
        run: npm test
      - name: Check deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."
          fi
      - name: Apply D1 migrations
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "1"
        run: npx --yes wrangler@4 d1 migrations apply melloid-public --remote
      - name: Deploy MelloID
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Smoke-test over HTTPS
        if: steps.creds.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            code=0; curl -fsS --proto '=https' --tlsv1.2 -o /dev/null https://id.mellogram.foulfoxhacks.dev/ || code=$?
            if [ "$code" = 0 ]; then echo "MelloID answers"; exit 0; fi
            if [ "$code" != 35 ] && [ "$code" != 60 ] && [ "$code" != 6 ] && [ "$code" != 7 ]; then echo "::error::MelloID failed (curl $code)"; exit 1; fi
            sleep 20
          done
          echo "::warning::MelloID has no certificate or DNS yet; Cloudflare is still issuing it"
