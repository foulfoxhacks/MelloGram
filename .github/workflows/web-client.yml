name: Web client deploy

# Deploys services/web-client to Cloudflare Workers:
#   https://wc.mellogram.foulfoxhacks.dev      (shell)
#   https://wc-api.mellogram.foulfoxhacks.dev  (API)
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit and
# Workers Routes / custom domains on the foulfoxhacks.dev zone) and
# CLOUDFLARE_ACCOUNT_ID. Without them the job tests and reports, then stops
# without failing, so forks and branches stay green.

on:
  push:
    branches: [main]
    paths: ["services/web-client/**", ".github/workflows/web-client.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-client-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: services/web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test routing, headers, CORS and HTTPS handling
        run: npm test
      - name: Check deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."
          fi
      - name: Deploy the Worker (both hostnames)
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Smoke-test the live endpoints over HTTPS
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            if curl -fsS --proto '=https' --tlsv1.2 https://wc.mellogram.foulfoxhacks.dev/api/health \
               && curl -fsS --proto '=https' --tlsv1.2 https://wc-api.mellogram.foulfoxhacks.dev/api/status >/dev/null; then
              echo; echo "both hostnames answer"; exit 0
            fi
            sleep 20
          done
          echo "::error::the deployed endpoints did not answer"; exit 1
      - name: Check HSTS and CORS on the live API
        if: steps.creds.outputs.ready == 'true'
        run: |
          curl -fsSI https://wc.mellogram.foulfoxhacks.dev/ | grep -i '^strict-transport-security'
          curl -fsS -D - -o /dev/null -H 'Origin: https://wc.mellogram.foulfoxhacks.dev' https://wc-api.mellogram.foulfoxhacks.dev/api/status \
            | grep -i '^access-control-allow-origin: https://wc.mellogram.foulfoxhacks.dev'
