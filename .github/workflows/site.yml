name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Serialize all Pages deployments under the same group to prevent stale
# legacy workflows from racing the current deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the website
    runs-on: ubuntu-latest
    env:
      # Public address of the site; override with the repository variable SITE_URL.
      SITE_URL: ${{ vars.SITE_URL || 'https://mellogram.foulfoxhacks.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node site/build.mjs
      - name: SEO / AEO / GEO checks
        run: node site/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
