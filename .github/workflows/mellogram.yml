name: MelloGram CI and Packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mellogram-${{ github.ref }}
  # Do not kill long native Android builds when another commit is pushed.
  cancel-in-progress: false

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: |
          node --check app/ui/profile.js
          node --check app/ui/app.js
          node --check app/ui/settings.js
          node --check app/ui/extras.js
          node --check app/ui/studio.js
          node --check app/ui/wallpapers.js
          node --check app/ui/mg.js
          node --check app/ui/e2e.js
          node --check app/ui/info.js
          node --check app/ui/media.js
          node --check docs/examples/mellorpc-node-example.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Unit tests (core, plugins, telegram)
        run: cargo test --workspace --exclude mellogram

  desktop:
    name: Desktop packages (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          # macos-14 runners are being retired (jobs were cancelled before
          # getting a runner); macos-latest is Apple Silicon.
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      # Optional signing material; unset secrets are empty, so every signing
      # step below skips itself instead of failing the build.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # ---- Linux: .deb, .rpm, AppImage --------------------------------------
      - name: Build Linux packages
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo tauri build --bundles deb,rpm,appimage
      - name: Collect Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb           dist/MelloGram-linux-amd64.deb
          cp target/release/bundle/rpm/*.rpm           dist/MelloGram-linux-x86_64.rpm
          cp target/release/bundle/appimage/*.AppImage dist/MelloGram-linux-x86_64.AppImage

      # ---- Windows: Inno Setup installer + MSI --------------------------------
      - name: Build Windows app and MSI
        if: runner.os == 'Windows'
        working-directory: app/src-tauri
        run: cargo tauri build --bundles msi
      - name: Build Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/windows/MicrosoftEdgeWebview2Setup.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\target\release" installer\windows\mellogram.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer/windows/Output/MelloGram-Setup-x64.exe dist/MelloGram-Setup-x64.exe
          Copy-Item (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName dist/MelloGram-windows-x64.msi

      - name: Sign the Windows installers (optional)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "mellogram.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          foreach ($f in @("dist\MelloGram-Setup-x64.exe", "dist\MelloGram-windows-x64.msi")) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $f
            if ($LASTEXITCODE -ne 0) { throw "signing $f failed" }
          }
          Remove-Item $pfx
          Write-Host "Authenticode signatures applied"

      # ---- macOS: universal .dmg (Apple Silicon + Intel) ------------------------
      - name: Build macOS universal app and DMG
        if: runner.os == 'macOS'
        working-directory: app/src-tauri
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Collect macOS packages
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/MelloGram-macos-universal.dmg

      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${{ matrix.platform }}"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.platform }}"
          fi
          cat "SHA256SUMS-${{ matrix.platform }}"

      - name: Upload ${{ matrix.platform }} packages
        uses: actions/upload-artifact@v4
        with:
          name: mellogram-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK and AAB
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Avoid the retired SDK "tools" package; modern runners already provide cmdline-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate Android project
        working-directory: app/src-tauri
        run: cargo tauri android init --ci
      - name: Add Firebase Messaging service to Android manifest
        run: python3 scripts/configure-android-firebase.py
      - name: Build debug APKs (arm64, armv7 and x86_64)
        working-directory: app/src-tauri
        run: cargo tauri android build --apk --debug --target aarch64 --target armv7 --target x86_64
      - name: Build release APKs (arm64 and armv7)
        working-directory: app/src-tauri
        run: cargo tauri android build --apk --target aarch64 --target armv7
      - name: Build release Android App Bundle
        working-directory: app/src-tauri
        run: cargo tauri android build --aab --target aarch64 --target armv7
      - name: Sign, validate and collect Android packages
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          out=app/src-tauri/gen/android/app/build/outputs
          mkdir -p dist
          bt="$ANDROID_SDK_ROOT/build-tools/34.0.0"

          # Select a real Gradle-produced APK instead of assuming a filename.
          find_apk() {
            local profile="$1"
            find "$out/apk" -type f -name '*.apk' -path "*/$profile/*" -print | sort | head -n 1
          }

          release_apk="$(find_apk release || true)"
          debug_apk="$(find_apk debug || true)"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            test -n "$release_apk" || { echo "No release APK was produced"; exit 1; }
            printf '%s' "$KEYSTORE_B64" | base64 --decode > release.jks
            "$bt/zipalign" -f -p 4 "$release_apk" aligned.apk
            "$bt/apksigner" sign --ks release.jks \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out dist/MelloGram-android.apk aligned.apk
            rm -f release.jks aligned.apk
          else
            test -n "$release_apk" || { echo "No release APK was produced"; exit 1; }
            echo "::warning::No Android release keystore configured. Signing optimized release APK with a debug keystore for installability."
            keytool -genkeypair -v -keystore test.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MelloGram,O=FoulFoxHacks,C=US"
            "$bt/zipalign" -f -p 4 "$release_apk" aligned.apk
            "$bt/apksigner" sign --ks test.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out dist/MelloGram-android.apk aligned.apk
            rm -f test.keystore aligned.apk
            if [ -n "$debug_apk" ]; then
              cp "$debug_apk" dist/MelloGram-android-debug.apk
            fi
          fi

          # Validate every deliverable APK before upload.
          for apk in dist/*.apk; do
            "$bt/zipalign" -c -v 4 "$apk"
            "$bt/apksigner" verify --verbose --print-certs "$apk"
            "$bt/aapt" dump badging "$apk" | grep -F "package: name='app.mellogram.desktop'"
            unzip -t "$apk" >/dev/null
          done

          aab="$(find "$out/bundle" -type f -name '*.aab' -print | head -n 1)"
          test -n "$aab" || { echo "No Android App Bundle was produced"; exit 1; }
          cp "$aab" dist/MelloGram-android-unsigned.aab
          echo "Validated Android APK artifacts:"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: mellogram-android
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  smoke-linux:
    name: Launch the Linux package
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mellogram-linux
          path: pkg
      - name: Install a virtual display and the WebKitGTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libfuse2 libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      # Packaging proves a file exists, not that it starts. Exit code 124 is the
      # timeout killing an app that is still running, which is what a healthy
      # launch looks like in a headless session.
      - name: Start the AppImage and prove it stays up
        run: |
          chmod +x pkg/*.AppImage
          set +e
          timeout 40 dbus-run-session -- xvfb-run -a env \
            APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 GDK_BACKEND=x11 \
            ./pkg/*.AppImage > app.log 2>&1
          code=$?
          set -e
          echo "exit=$code"
          tail -n 40 app.log
          if [ "$code" -ne 124 ]; then
            echo "::error::the AppImage exited on its own (code $code)"
            exit 1
          fi
          if grep -qi "panicked at" app.log; then
            echo "::error::the app panicked during startup"
            exit 1
          fi

  release:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, smoke-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      # One checksum file covering every published file, generated from the
      # exact bytes being uploaded.
      - name: Write the release checksum file
        run: |
          cd release-assets
          rm -f SHA256SUMS-*
          sha256sum MelloGram-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/MelloGram-Setup-x64.exe
            release-assets/MelloGram-windows-x64.msi
            release-assets/MelloGram-macos-universal.dmg
            release-assets/MelloGram-linux-amd64.deb
            release-assets/MelloGram-linux-x86_64.rpm
            release-assets/MelloGram-linux-x86_64.AppImage
            release-assets/MelloGram-android.apk
            release-assets/MelloGram-android-unsigned.aab
            release-assets/SHA256SUMS

  melloid-public-service:
    name: MelloID public service tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and website JavaScript
        working-directory: services/melloid-public
        run: |
          node --check src/worker.js
          node --check src/profile.js
          node --check src/connections.js
          node --check public/index.js
          node --check public/dashboard.js
          node --check public/profile.js
      - name: Test profile validation and public projection
        working-directory: services/melloid-public
        run: node --test test/*.test.js

  web-client-service:
    name: Web client service tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and shell JavaScript
        working-directory: services/web-client
        run: |
          node --check src/worker.js
          node --check src/capabilities.js
          node --check public/app.js
      - name: Test routing, headers and capability claims
        working-directory: services/web-client
        run: node --test test/*.test.js

  site:
    name: Website build and Worker tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the site
        run: node site/build.mjs
      - name: Check SEO, links, headings and images
        run: node site/check.mjs
      - name: Validate site and Worker JavaScript
        run: |
          node --check site/home.mjs
          node --check site/pages.mjs
          node --check site/worker.mjs
          node --check site/serve.mjs
      - name: Test the site Worker
        run: node --test site/test/*.test.mjs

  wasm-overlay:
    name: WASM overlay build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test the bindings natively
        run: cargo test -p ametherian-truee2e-wasm
      - name: Build for the browser
        run: cargo build -p ametherian-truee2e-wasm --release --target wasm32-unknown-unknown
      - name: Check the artifact exists
        run: test -s target/wasm32-unknown-unknown/release/ametherian_truee2e_wasm.wasm
