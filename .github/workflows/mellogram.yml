name: MelloGram CI and Packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mellogram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: |
          node --check app/ui/profile.js
          node --check app/ui/app.js
          node --check app/ui/settings.js
          node --check app/ui/extras.js
          node --check docs/examples/mellorpc-node-example.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Unit tests (core, plugins, telegram)
        run: cargo test --workspace --exclude mellogram

  desktop:
    name: Desktop packages (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build platform packages
        working-directory: app/src-tauri
        run: cargo tauri build
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mellogram-${{ matrix.platform }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mellogram-${{ matrix.platform }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mellogram-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error

  android:
    name: Android APK and AAB
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Avoid the retired SDK "tools" package; modern runners already provide cmdline-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate Android project
        working-directory: app/src-tauri
        run: cargo tauri android init --ci
      - name: Add Firebase Messaging service to Android manifest
        run: python3 scripts/configure-android-firebase.py
      - name: Build debug APKs (arm64 and x86_64)
        working-directory: app/src-tauri
        run: cargo tauri android build --apk --debug --target aarch64 --target x86_64
      - name: Build release APKs (arm64 and armv7)
        working-directory: app/src-tauri
        run: cargo tauri android build --apk --target aarch64 --target armv7
      - name: Build release Android App Bundle
        working-directory: app/src-tauri
        run: cargo tauri android build --aab --target aarch64 --target armv7
      - uses: actions/upload-artifact@v4
        with:
          name: mellogram-android-apk-aab
          path: |
            app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*

  melloid-public-service:
    name: MelloID public service tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker and website JavaScript
        working-directory: services/melloid-public
        run: |
          node --check src/worker.js
          node --check src/profile.js
          node --check public/index.js
          node --check public/dashboard.js
          node --check public/profile.js
      - name: Test profile validation and public projection
        working-directory: services/melloid-public
        run: node --test test/*.test.js
