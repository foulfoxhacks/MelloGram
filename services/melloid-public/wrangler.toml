name = "melloid-public"
main = "src/worker.js"
compatibility_date = "2026-11-27"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
PUBLIC_BASE_URL = "https://profiles.example.com"

[[d1_databases]]
binding = "DB"
database_name = "melloid-public"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
