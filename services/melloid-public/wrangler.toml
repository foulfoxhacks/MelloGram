name = "melloid-public"
main = "src/worker.js"
compatibility_date = "2026-11-27"
workers_dev = false

# Public MelloID profiles. Cloudflare issues the certificate for the custom
# domain; the Worker adds HSTS and its own security headers.
routes = [
  { pattern = "id.mellogram.foulfoxhacks.dev", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# Pages are routed by the Worker, which asks for the exact file (/dashboard
# answers with /dashboard.html). The default "auto-trailing-slash" handling
# would answer that fetch with a 307 to /dashboard, which the Worker routes
# straight back into the same fetch: an endless redirect after sign-in.
html_handling = "none"

[vars]
PUBLIC_BASE_URL = "https://id.mellogram.foulfoxhacks.dev"
# Telegram Login Widget bot (its token is the TELEGRAM_BOT_TOKEN secret).
TELEGRAM_BOT_USERNAME = "melloidlogingatewaybot"

[[d1_databases]]
binding = "DB"
database_name = "melloid-public"
database_id = "c25a970f-9235-49f0-9e11-c68628c82a10"
migrations_dir = "migrations"
