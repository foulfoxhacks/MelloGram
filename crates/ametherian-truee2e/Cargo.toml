[package]
name = "ametherian-truee2e"
description = "End-to-end encryption privacy overlay for MelloGram chats (X3DH-style setup + Double Ratchet)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"

[dependencies]
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
base64 = "0.23"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
