[package]
name = "mellogram-telegram"
description = "Telegram (MTProto) backend for MelloGram, built on grammers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mellogram-core.workspace = true
grammers-client = { version = "0.12", features = ["proxy"] }
grammers-mtproto = "0.12"
grammers-session = "0.12"
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }
