[workspace]
resolver = "2"
members = [
    "crates/mellogram-core",
    "crates/mellogram-plugins",
    "crates/mellogram-telegram",
    "crates/mellorpc-core",
    "crates/melloid-core",
    "crates/ametherian-truee2e",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/foulfoxhacks/MelloGram"
rust-version = "1.80"

[workspace.dependencies]
mellogram-core = { path = "crates/mellogram-core" }
mellogram-plugins = { path = "crates/mellogram-plugins" }
mellogram-telegram = { path = "crates/mellogram-telegram" }
melloid-core = { path = "crates/melloid-core" }
mellorpc-core = { path = "crates/mellorpc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
regex = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
